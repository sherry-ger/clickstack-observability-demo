# Applied after demo/docker-compose.all-in-one.yml. Requires Compose !override support.
name: ${COMPOSE_PROJECT_NAME:-kubecon-training}
services:
  clickstack:
    image: clickhouse/clickstack-all-in-one:2.42.0@sha256:1689304bf8f9eab8a5c9069ea8fec2fe52a47de3bf46b4beafb05d5f155680df
    container_name: ${KUBECON_CONTAINER_PREFIX:-kubecon}-clickstack
    ports: !override
      - "127.0.0.1:${KUBECON_UI_PORT:-8080}:8080"
      - "127.0.0.1:${KUBECON_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${KUBECON_OTLP_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${CLICKHOUSE_PORT:-8123}:8123"
    environment:
      FRONTEND_URL: http://localhost:${KUBECON_UI_PORT:-8080}
      DEMO_SQL_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}
    volumes: !override
      - kubecon-mongo:/data/db
      - kubecon-clickhouse:/var/lib/clickhouse
      - kubecon-clickhouse-logs:/var/log/clickhouse-server
      - ../config/clickhouse-demo-user.xml:/etc/clickhouse-server/users.d/demo.xml:ro
  postgres-db:
    image: postgres:18.6@sha256:bd5dfa494a5a259704365813dbfa5fa6b3e69be7348d43b547f540c730478583
    container_name: ${KUBECON_CONTAINER_PREFIX:-kubecon}-postgres-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: !override
      - ./postgresql-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - kubecon-postgres:/var/lib/postgresql
  subscription-app:
    image: ${KUBECON_SUBSCRIPTION_IMAGE:?Run python3 scripts/build_images.py first}
    pull_policy: never
    container_name: ${KUBECON_CONTAINER_PREFIX:-kubecon}-subscription-app
    build: !reset null
    ports: !override
      - "127.0.0.1:${KUBECON_APP_PORT:-8000}:8000"
    environment:
      # Browser requests use the host OTLP port; backend export stays on Docker DNS.
      HYPERDX_ENDPOINT: http://localhost:${KUBECON_OTLP_HTTP_PORT:-4318}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=1).raise_for_status()"]
  docs-loader:
    # Content IDs are generated for this daemon by the pinned source build.
    image: ${KUBECON_DOCS_LOADER_IMAGE:?Run python3 scripts/build_images.py first}
    pull_policy: never
    container_name: ${KUBECON_CONTAINER_PREFIX:-kubecon}-docs-loader
    build: !reset null
    environment:
      # Soft Go target stabilizes ordinary operation; /load retains touched pages.
      GOMEMLIMIT: 6MiB
    ports: !override
      - "127.0.0.1:${KUBECON_DOCS_PORT:-8001}:8001"
  load-generator:
    image: ghcr.io/clickhouse/clickstack-demo-subscription-app:26.9.0-load-generator@sha256:63beb3e3b83315ca66c1e290e5bbc19727ea2cae18f6de24961f97bfe68489dc
    container_name: ${KUBECON_CONTAINER_PREFIX:-kubecon}-load-generator
    build: !reset null
    # Opt in only when the controlled-traffic task is ready.
    profiles: [traffic]
  socat:
    image: alpine/socat:1.8.1.3@sha256:466c8a0383e16463fabdb7df01008292fb78d07da60224a46cb5d3142ce122ed
    container_name: ${KUBECON_CONTAINER_PREFIX:-kubecon}-socat
  otel-collector:
    image: ${KUBECON_COLLECTOR_IMAGE:?Run python3 scripts/build_images.py first}
    pull_policy: never
    container_name: ${KUBECON_CONTAINER_PREFIX:-kubecon}-otel-collector
    build: !reset null
  docker-events:
    # Reuse the built Python runtime; run the observer without SDK auto-instrumentation.
    image: ${KUBECON_SUBSCRIPTION_IMAGE:?Run python3 scripts/build_images.py first}
    pull_policy: never
    container_name: ${KUBECON_CONTAINER_PREFIX:-kubecon}-docker-events
    entrypoint: ["python", "/opt/docker_events.py"]
    restart: unless-stopped
    environment:
      DOCKER_EVENTS_URL: http://socat:2375
      DOCKER_DEMO_PROJECT: ${COMPOSE_PROJECT_NAME:-kubecon-training}
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://clickstack:4318/v1/logs
      HYPERDX_API_KEY: ${HYPERDX_API_KEY:?Set the ingestion key in .env}
    volumes:
      - ../scripts/docker_events.py:/opt/docker_events.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:13134/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      socat:
        condition: service_healthy
      clickstack:
        condition: service_healthy

volumes:
  kubecon-mongo:
  kubecon-clickhouse:
  kubecon-clickhouse-logs:
  kubecon-postgres:
networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-kubecon-training}
